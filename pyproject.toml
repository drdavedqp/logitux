[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logitux"
version = "0.1.0"
description = "Simple Logitech Options+ style helper for Nobara/Linux"
requires-python = ">=3.10"

[project.scripts]
logitux = "logitux.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
